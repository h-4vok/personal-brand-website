name: Accessibility

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "content/**"
      - "data/**"
      - "i18n/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - "archetypes/**"
      - "hugo.toml"
      - "hugo.yaml"
      - "hugo.yml"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - "tools/**"
  pull_request:
    paths:
      - "assets/**"
      - "content/**"
      - "data/**"
      - "i18n/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - "archetypes/**"
      - "hugo.toml"
      - "hugo.yaml"
      - "hugo.yml"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - "tools/**"
  workflow_dispatch: {}

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod-a11y:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility audit against production
        run: npm run a11y:prod

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-prod-artifacts
          path: |
            .lighthouseci/a11y/**
          if-no-files-found: ignore
