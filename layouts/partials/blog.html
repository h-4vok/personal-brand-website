{{ $posts := first 6 (where site.RegularPages "Section" "==" "blog") }}
{{ if $posts }}
<section id="blog" class="ops-briefings">
  <div class="ops-briefings__head">
    <div><p class="ops-eyebrow">KNOWLEDGE BASE / 06 RECENT NOTES</p><h2>Field notes</h2></div>
    <a class="ops-text-link" href="{{ `articles/` | absLangURL }}">Open the full index <span aria-hidden="true">↗</span></a>
  </div>
  <div class="ops-briefings__list">
    {{ range $posts }}
      {{ .Render "article" }}
    {{ end }}
  </div>
</section>
{{ end }}
