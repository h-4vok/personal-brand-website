<article class="ops-briefing">
  <a class="ops-briefing__link" href="{{ .Permalink }}">
    <span class="ops-briefing__index" aria-hidden="true">↗</span>
    <span class="ops-briefing__body">
      <span class="ops-briefing__meta">{{ with .Params.categories }}{{ index . 0 }}{{ else }}FIELD NOTE{{ end }} <i aria-hidden="true">/</i> {{ .Date.Format "02 Jan 2006" }}</span>
      <strong>{{ .Title }}</strong>
      <span class="ops-briefing__description">{{ .Description }}</span>
    </span>
    <span class="ops-briefing__read">{{ .ReadingTime }} MIN <b aria-hidden="true">↗</b></span>
  </a>
</article>
