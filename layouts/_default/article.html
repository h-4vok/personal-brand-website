<article class="field-entry">
  {{ $category := "FIELD NOTE" }}{{ with .Params.categories }}{{ $category = index . 0 }}{{ end }}
  <p class="field-entry__meta"><span>{{ $category }}</span><span>{{ .Date.Format "02 Jan 2006" }}</span></p>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="field-entry__description">{{ .Description }}</p>
  <a class="field-entry__read" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}">Read entry <span aria-hidden="true">↗</span></a>
  <span class="field-entry__number" aria-hidden="true">{{ .Date.Format "06" }}—{{ printf "%02d" .Date.Month }}</span>
</article>
