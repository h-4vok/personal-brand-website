<article class="archive-record">
  <a href="{{ .RelPermalink }}" class="archive-record__link">
    <span class="archive-record__spine" aria-hidden="true"><span>{{ .Date.Format "2006" }}</span></span>
    <span class="archive-record__main">
      <span class="archive-record__meta">{{ with .Params.categories }}{{ index . 0 }}{{ else }}Thread study{{ end }} <span>·</span> {{ .ReadingTime }} min</span>
      <strong>{{ .Title }}</strong>
      <span class="archive-record__description">{{ .Description | default .Summary | plainify | htmlUnescape | truncate 210 }}</span>
    </span>
    <span class="archive-record__mark" aria-hidden="true">↗</span>
  </a>
</article>
